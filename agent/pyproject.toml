[project]
name = "sarjy-agent"
version = "0.1.0"
description = "Sarjy LiveKit Agents worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents>=1.4.0",
    "pydantic-settings>=2.6.0",
    "python-frontmatter>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "flake8>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
